<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#021733">
<title>Home</title>
<!-- Both images are referenced from CSS/JS, so without these they'd wait for the
     stylesheet and the module graph to resolve first. Preloading starts them at
     the same instant as the HTML. -->
<link rel="preload" as="image" href="assets/sprite.webp">
<link rel="preload" as="image" href="assets/wallpaper.webp">

<!-- ES modules load in waves: main.js can't request what it imports until it has
     been fetched and parsed, and so on down the graph. That was three round
     trips before a single icon appeared. modulepreload fetches the whole graph
     in parallel, immediately. -->
<link rel="modulepreload" href="js/main.js">
<link rel="modulepreload" href="js/homescreen.js">
<link rel="modulepreload" href="js/splash.js">
<link rel="modulepreload" href="js/scorecard.js">
<link rel="modulepreload" href="js/board.js">
<link rel="modulepreload" href="js/boardscreen.js">
<link rel="modulepreload" href="js/share.js">
<link rel="modulepreload" href="js/analytics.js">
<link rel="modulepreload" href="js/api.js">
<link rel="modulepreload" href="js/sound.js">
<link rel="modulepreload" href="js/fire.js">
<link rel="modulepreload" href="js/longpress.js">
<link rel="modulepreload" href="js/game.js">
<link rel="modulepreload" href="js/apps.js">
<link rel="modulepreload" href="js/sprite.js">
<link rel="modulepreload" href="js/liveicons.js">
<link rel="modulepreload" href="js/dials.js">
<link rel="modulepreload" href="js/uvy.js">
<link rel="modulepreload" href="js/install.js">
<link rel="modulepreload" href="js/config.js">
<link rel="modulepreload" href="js/physics.js">
<link rel="modulepreload" href="js/hoop.js">
<link rel="modulepreload" href="js/transform.js">
<link rel="modulepreload" href="js/tilt.js">

<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="assets/touch-icon.png">
<link rel="stylesheet" href="css/styles.css">

<!-- The splash is inline — markup, styles and logo all in this file — so it
     paints on the very first frame. Pulling any of it from another file would
     mean a round trip before the loading screen itself could show up. -->
<style>
  /* ── the loading screen ──────────────────────────────────────
     Roughly a second on screen, so everything here has to read at a glance.
     The tile is the app icon behaving like a basketball, which is the trick the
     whole game is built on — so the splash is a small promise of it. */
  #splash {
    position: fixed;
    inset: 0;
    z-index: 200;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    /* Brand yellow, and the manifest's background_color matches it, so the
       launch screen iOS paints before the page exists is the same colour as the
       page — nothing flashes between the two. */
    background: linear-gradient(#ffe55c 0%, #ffc800 100%);
    /* The exit: the whole screen lifts away and fades, the way an app opens.
       Scaled here rather than on the tile so it composes with the dribble —
       stopping that animation mid-flight would snap the transform and jump. */
    transition: opacity .5s ease, transform .5s cubic-bezier(.36, 0, .2, 1);
    /* failsafe: if the scripts never run, don't trap anyone on a blank screen */
    animation: splash-bail 1ms linear 6s forwards;
  }
  #splash.done {
    opacity: 0;
    transform: scale(1.14);
    pointer-events: none;
  }
  @keyframes splash-bail { to { opacity: 0; visibility: hidden; } }

  /* No tile. The white one existed only because a black-on-yellow logo needs a
     light surface to sit on, and on yellow it already has one — the dark disc
     drawn behind the face is what keeps it from melting into the background.
     This element is now just the thing that bounces. */
  #splash .tile {
    width: 152px;
    height: 152px;
    display: flex;
    align-items: center;
    justify-content: center;
    /* Squash from the base, not the middle. A ball flattening against the floor
       keeps its contact point still; scaling about the centre makes it sink
       into the ground instead. */
    transform-origin: 50% 100%;
    /* Falls in first, then picks up the loop. The two never overlap — drop-in
       has finished by the time dribble starts — so they can share `transform`
       without fighting, and drop-in lands on exactly the pose dribble opens on,
       which is what makes the handover invisible. */
    animation: drop-in .42s cubic-bezier(.3, 0, .7, .5) both,
               dribble 1.05s .42s infinite;
  }
  #splash .tile svg {
    width: 100%;
    height: 100%;
    display: block;
    /* it used to borrow the tile's box-shadow; now it needs its own lift */
    filter: drop-shadow(0 10px 16px rgba(120, 74, 0, .34));
    /* A lean into the bounce rather than a spin. A full rotation on a face
       reads as tumbling — this just gives it weight. */
    animation: lean 1.05s .42s ease-in-out infinite;
  }

  #splash .shadow {
    width: 92px;
    height: 11px;
    margin-top: 13px;
    border-radius: 50%;
    background: #6b4200;
    filter: blur(4px);
    /* Hidden until the tile has landed — a shadow with nothing above it is a
       smudge. The delay leaves it at this opacity until dribble takes over. */
    opacity: 0;
    animation: squash 1.05s .42s infinite;
  }

  #splash .by {
    margin-top: 30px;
    font: 600 12px/1 -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    letter-spacing: 2.6px;
    text-transform: uppercase;
    color: #16161a;
    text-shadow: 0 1px 1px rgba(255, 255, 255, .45), 0 2px 6px rgba(120, 74, 0, .28);
    opacity: 0;
    animation: sign-in .45s ease .52s forwards;
  }

  /* Arrives from above and hands over at the top of the first bounce. */
  @keyframes drop-in {
    0%   { transform: translateY(-190px) scale(.9, 1.12); opacity: 0; }
    55%  { opacity: 1; }
    100% { transform: translateY(-34px) scale(1, 1); opacity: 1; }
  }

  /* A dribble, not a drop: the height holds because a hand keeps putting the
     energy back. What sells it is the stretch on the way down and the fact that
     contact is nearly instant — most of the cycle is spent in the air. */
  @keyframes dribble {
    0%   { transform: translateY(-34px) scale(1, 1);
           animation-timing-function: cubic-bezier(.4, 0, .85, .5); }
    36%  { transform: translateY(-8px) scale(.93, 1.09);
           animation-timing-function: cubic-bezier(.8, 0, .9, .6); }
    46%  { transform: translateY(0) scale(1.14, .85);
           animation-timing-function: cubic-bezier(.05, .75, .35, 1); }
    56%  { transform: translateY(-12px) scale(.95, 1.06); }
    100% { transform: translateY(-34px) scale(1, 1); }
  }

  @keyframes lean {
    0%, 100% { transform: rotate(-4deg); }
    46%      { transform: rotate(0deg); }
    64%      { transform: rotate(3deg); }
  }

  /* Tight and dark under the ball, wide and faint when it's up. */
  @keyframes squash {
    0%, 100% { transform: scale(.5, .7); opacity: .14; }
    46%      { transform: scale(1, 1);   opacity: .40; }
  }

  @keyframes sign-in {
    from { opacity: 0; transform: translateY(4px); }
    to   { opacity: .8; transform: none; }
  }

  /* Everything above is motion for its own sake, so none of it survives here —
     but the pieces that animate their own way IN need their end state putting
     back, or they'd simply never appear. */
  @media (prefers-reduced-motion: reduce) {
    #splash .tile,
    #splash .tile svg,
    #splash .shadow,
    #splash .by { animation: none; }
    #splash .shadow { opacity: .22; }
    #splash .by { opacity: .8; }
    #splash.done { transform: none; }
  }
</style>
</head>
<body>

<div id="splash">
  <div class="tile">
    <svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="UVY">
      <!-- headphone cups, behind the head -->
      <ellipse cx="252" cy="500" rx="66" ry="108" fill="#16161a"/>
      <ellipse cx="772" cy="500" rx="66" ry="108" fill="#16161a"/>
      <!-- dark disc that shows as the rim around the face -->
      <circle cx="512" cy="514" r="248" fill="#16161a"/>
      <!-- the eared face -->
      <path d="M272 226 L380 334 C425 288 465 270 512 270 C559 270 599 288 644 334
               L752 226 L748 506 C748 642 641 730 512 730 C383 730 276 642 276 506 Z"
            fill="#FFD91C" stroke="#16161a" stroke-width="26" stroke-linejoin="round"/>
      <!-- U and V for eyes -->
      <path d="M366 406 L366 462 C366 518 460 518 460 462 L460 406"
            fill="none" stroke="#16161a" stroke-width="21" stroke-linecap="round"/>
      <path d="M566 406 L614 514 L662 406"
            fill="none" stroke="#16161a" stroke-width="21"
            stroke-linecap="round" stroke-linejoin="round"/>
      <!-- smile -->
      <path d="M400 590 C438 666 586 666 624 590"
            fill="none" stroke="#16161a" stroke-width="22" stroke-linecap="round"/>
    </svg>
  </div>
  <div class="shadow"></div>
  <p class="by">made by uv kush</p>
</div>

<div id="wallpaper"></div>
<div id="dim"></div>

<!-- Phone chrome, not part of the home screen: it sits above every app screen
     the way a real status bar does, so it has to live outside #home. -->
<div id="statusbar">
    <span id="clock">9:41</span>
    <span class="status-right">
      <svg width="18" height="12" viewBox="0 0 18 12" aria-hidden="true"><g fill="currentColor">
        <rect x="0"  y="8" width="3" height="4" rx="1"/>
        <rect x="5"  y="5.5" width="3" height="6.5" rx="1"/>
        <rect x="10" y="3" width="3" height="9" rx="1"/>
        <rect x="15" y="0" width="3" height="12" rx="1"/>
      </g></svg>
      <svg width="17" height="12" viewBox="0 0 17 12" aria-hidden="true"><g fill="currentColor">
        <path d="M8.5 11.6 6.1 9.1a3.4 3.4 0 0 1 4.8 0z"/>
        <path d="M8.5 6.2c1.5 0 2.9.6 4 1.6l1.6-1.7A8 8 0 0 0 8.5 3.9a8 8 0 0 0-5.6 2.2l1.6 1.7a5.8 5.8 0 0 1 4-1.6z"/>
        <path d="M8.5 1.6c2.7 0 5.2 1 7.1 2.8L17 2.8A11.9 11.9 0 0 0 8.5 0 11.9 11.9 0 0 0 0 2.8l1.4 1.6A10.2 10.2 0 0 1 8.5 1.6z"/>
      </g></svg>
      <svg width="27" height="13" viewBox="0 0 27 13" aria-hidden="true">
        <rect x="0.5" y="0.5" width="22" height="12" rx="3.8" fill="none" stroke="currentColor" stroke-opacity=".4"/>
        <rect x="2" y="2" width="16" height="9" rx="2.2" fill="currentColor"/>
        <path d="M24.5 4.3v4.4a2.3 2.3 0 0 0 0-4.4z" fill="currentColor" fill-opacity=".45"/>
      </svg>
    </span>
</div>

<!-- ── the fake home screen ───────────────────────────────── -->
<div id="home">
  <div id="pages"><div id="track"></div></div>

  <div id="dots"></div>

  <button id="spotlight" type="button">
    <svg width="13" height="13" viewBox="0 0 16 16" aria-hidden="true">
      <circle cx="6.8" cy="6.8" r="5.2" fill="none" stroke="currentColor" stroke-width="2"/>
      <path d="M10.7 10.7 15 15" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    </svg>
    <span>Search</span>
  </button>

  <div id="dock"><div id="dock-icons"></div></div>
</div>

<!-- ── the game ───────────────────────────────────────────── -->
<!-- `inert` (not aria-hidden) so the buttons inside can't be focused or read
     while the court is put away — aria-hidden alone leaves them tabbable -->
<div id="court" inert>
  <div class="layer" id="hoop-back"></div>
  <div class="layer" id="embers"></div>
  <div class="layer" id="balls"></div>
  <div class="layer" id="hoop-front"></div>

  <div id="hint"><svg width="15" height="9" viewBox="0 0 15 9" aria-hidden="true"><path d="M1.5 7.5 7.5 1.5l6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Flick up</span></div>

  <div id="hud"><b id="hud-score">0</b><span id="hud-shots">24 left</span><span id="streak">ON FIRE</span></div>
  <button id="tilt" type="button">Tilt</button>
  <div id="flash"></div>

  <div id="scorecard">
    <!-- how it went -->
    <div class="card" data-panel="result">
      <p class="eyebrow">Final</p>
      <p class="tally"><b id="final-score">0</b><span id="final-total">/ 24</span></p>
      <p class="rank" id="final-rank">Airball</p>
      <button id="join" type="button" hidden>Get on the leaderboard</button>
      <button id="again" type="button">Keep going</button>
      <button id="quit" type="button" class="ghost">Go home</button>
      <button class="x-share" type="button" data-share-x><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>Share on X</button>
      <button class="link" type="button" data-install>Add this to your home screen</button>
    </div>

    <!-- name + contact -->
    <form class="card" data-panel="join" hidden novalidate>
      <p class="eyebrow">Leaderboard</p>
      <h2 class="ttl">Put your name up</h2>
      <label class="field">
        <span>Name</span>
        <input id="f-name" type="text" maxlength="18" autocomplete="nickname"
               enterkeyhint="next" placeholder="This is what everyone sees">
      </label>
      <label class="field">
        <span>Email or phone</span>
        <input id="f-contact" type="text" maxlength="120" autocomplete="email"
               inputmode="email" enterkeyhint="go" placeholder="Kept private">
      </label>
      <div class="chips" id="domain-chips"></div>
      <p class="err" id="f-err" hidden></p>
      <button id="f-go" type="submit">Submit my score</button>
      <button type="button" class="ghost" data-back>Back</button>
    </form>

    <!-- the board -->
    <div class="card" data-panel="board" hidden>
      <p class="eyebrow">Leaderboard</p>
      <p class="you" id="you-rank"></p>
      <ol id="board" class="board"></ol>
      <button id="share" type="button">Try it on a friend's phone</button>
      <button class="x-share" type="button" data-share-x><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>Share on X</button>
      <button id="again2" type="button" class="ghost">Keep going</button>
      <button id="quit2" type="button" class="ghost">Go home</button>
      <button class="link" type="button" data-install>Add this to your home screen</button>
    </div>
  </div>
</div>

<div id="homebar"></div>

<script type="module" src="js/main.js"></script>
</body>
</html>
